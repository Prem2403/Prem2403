<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF4ECD"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF4ECD"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="win">
      <rect x="4" y="4" width="892" height="292" rx="18"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="892" height="292" rx="18" fill="#0d1117"/>

  <g clip-path="url(#win)">
    <rect x="4" y="4" width="892" height="292" fill="url(#grid)"/>
    <rect x="4" y="4" width="892" height="38" fill="#161b22"/>
    <line x1="4" y1="42" x2="896" y2="42" stroke="#30363d"/>
    <circle cx="28" cy="23" r="6" fill="#FF5F56"/>
    <circle cx="50" cy="23" r="6" fill="#FFBD2E"/>
    <circle cx="72" cy="23" r="6" fill="#27C93F"/>
    <text x="450" y="28" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#8b949e">prem@github: ~/portfolio</text>
    <rect x="4" y="42" width="892" height="60" fill="url(#scan)">
      <animate attributeName="y" values="42;240;42" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="90" cy="120" r="2" fill="#00D9FF">
    <animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="95" r="2" fill="#FF4ECD">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="230" r="3" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="240" r="3" fill="#A78BFA">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <rect x="4" y="4" width="892" height="292" rx="18" fill="none" stroke="url(#border)" stroke-width="3" stroke-dasharray="320 120" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-880" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="892" height="292" rx="18" fill="none" stroke="#00D9FF" stroke-opacity="0.15" stroke-width="1.5"/>

  <text x="40" y="95" font-family="Courier New, monospace" font-size="20" fill="#27C93F" opacity="0">$ who am I
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <text x="450" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="6" fill="url(#nameGrad)" filter="url(#glow)" opacity="0">PREM KUMAR
    <animate attributeName="opacity" values="0;1" begin="1s" dur="1.2s" fill="freeze"/>
  </text>

  <g font-family="Courier New, monospace" font-size="24" font-weight="bold" text-anchor="middle" fill="#00D9FF">
    <text x="450" y="228" opacity="0">&lt; Machine Learning Engineer /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="228" opacity="0">&lt; Full-Stack Developer /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="5.2s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="228" opacity="0">&lt; Data Science &amp; Kaggle /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="8.2s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="228" opacity="0">&lt; DSA &amp; Problem Solver /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="11.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="40" y="275" font-family="Courier New, monospace" font-size="18" fill="#27C93F">$</text>
  <rect x="62" y="260" width="11" height="18" fill="#FF4ECD">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
